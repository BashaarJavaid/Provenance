[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance"
version = "0.1.0"
description = "A fleet of agents that detects, diagnoses, fixes, and verifies enterprise incidents, and writes what it confirmed into a governed institutional memory."
requires-python = "==3.12.*"
dependencies = [
    # Pinned to the versions the item-0.5 dependency spike verified against.
    "google-adk==2.7.1",
    # Ours, not Portunus's. Portunus pins cryptography==49.0.0; 50.0.0 is verified working (ROADMAP item 0.5).
    "cryptography>=50.0.0",
    # Cloud Trace export (ROADMAP item 2). opentelemetry-api and -sdk arrive via google-adk
    # and are deliberately not re-pinned here — ADK caps them at <=1.42.1 and a second pin
    # would only drift. google-adk[gcp] would also work but pulls four more packages
    # (logging, monitoring, OTLP-http, resource detector) we don't emit to.
    "opentelemetry-exporter-gcp-trace>=1.9,<2",
    # The Cloud Run service (ROADMAP item 3). Both already arrive via google-adk; declared
    # here because we import them, with ADK's own ranges so the two can never conflict.
    "fastapi>=0.133,<1",
    "uvicorn>=0.34,<1",
    # The agent registry (ROADMAP item 5). Dev-only through item 4, when the sole importer
    # was scripts/seed_firestore.py; provenance/registry.py now reads Firestore from inside
    # the package, so it has to ship in the Cloud Run image. Not a google-adk transitive
    # dep — it was not installed at all before item 4.
    "google-cloud-firestore>=2.21,<3",
]

# portunusmcp is deliberately NOT listed here. It pins fastapi==0.115.6, which pip
# silently downgrades out of google-adk's supported range (>=0.133,<1) instead of
# erroring. It installs as a separate step and `pip check` is expected to fail:
#     pip install -e ".[dev]" && pip install --no-deps portunusmcp==0.1.0
# See ROADMAP.md item 0.5 and docs/adr/ADR-004. Do not "fix" this by adding it.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.setuptools.packages.find]
include = ["provenance*"]

# The UI shell is a data file, not a module; without this the wheel drops it.
[tool.setuptools.package-data]
provenance = ["web/*.html"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# portunusmcp ships no py.typed marker, so mypy cannot see inside `services.gateway`.
# provenance/credentials.py is the first module inside the package to import it (item 7).
# Scoped to that one distribution: everything we write stays under --strict.
[[tool.mypy.overrides]]
module = "services.*"
ignore_missing_imports = true
